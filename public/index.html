<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Rawat Inap - Glassmorphism</title>
    
    <link rel="icon" type="image/png" href="acalogo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --text-primary: #ffffff;
            --text-secondary: #b3b9c5;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            background-attachment: fixed;
        }

        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1;
        }
        body::before { background: rgba(99, 102, 241, 0.3); width: 400px; height: 400px; top: -100px; left: -100px; }
        body::after { background: rgba(168, 85, 247, 0.2); width: 500px; height: 500px; bottom: -150px; right: -150px; }

        .container { max-width: 1280px; margin: 0 auto; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: var(--glass-shadow);
            padding: 1.5rem; margin-bottom: 1.5rem;
        }

        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .header-brand { display: flex; align-items: center; gap: 1.2rem; }
        .header-logo { width: 55px; height: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); background: rgba(255,255,255,0.1); padding: 4px; }
        .header-title h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: 0.5px; }
        .header-title p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
        .clock-widget { background: rgba(0,0,0,0.2); padding: 8px 16px; border-radius: 30px; border: 1px solid var(--glass-border); font-family: monospace; font-size: 1.1rem; letter-spacing: 1px; color: #a78bfa; }

        .filter-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 1.2rem; align-items: end;}
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .glass-input {
            background: rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.1); color: white;
            padding: 12px 16px; border-radius: 10px; font-size: 0.9rem; transition: all 0.3s ease; outline: none;
        }
        .glass-input option { background: #1e1b4b; color: white; }
        .glass-input:focus { border-color: var(--accent-color); background: rgba(0, 0, 0, 0.25); box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }

        .btn-sync {
            background: var(--accent-color); color: white; border: none; padding: 12px 24px; border-radius: 10px;
            cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; height: 46px;
        }
        .btn-sync:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4); }

        .table-container { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 1rem; font-size: 0.85rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        th { background: rgba(0, 0, 0, 0.2); color: #a78bfa; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; white-space: nowrap; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.04); }

        .text-bold { font-weight: 600; color: white; }
        .text-dim { color: var(--text-secondary); font-size: 0.8rem; margin-top: 4px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; margin-top: 6px; }
        .badge-room { background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; }

        .loading-state, .empty-state { text-align: center; padding: 4rem; color: var(--text-secondary); }
        .spinner {
            display: inline-block; width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .api-status { text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 20px; font-family: monospace;}
        .api-status span { color: #a855f7; font-weight: bold; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: flex-start; }
            .clock-widget { align-self: flex-start; }
            .filter-grid { grid-template-columns: 1fr; }
            .btn-sync { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="glass-panel header">
            <div class="header-brand">
                <img src="acalogo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="header-title">
                    <h1>Antrian Pasien Rawat Inap</h1>
                    <p>Real-time Integrasi Data RSUD & API Endpoint</p>
                </div>
            </div>
            <div class="clock-widget" id="live-clock">Memuat Waktu...</div>
        </header>

        <!-- Filter Panel -->
        <div class="glass-panel">
            <div class="filter-grid">
                <div class="input-group">
                    <label for="filter-cari">Pencarian Pasien / No. RM</label>
                    <input type="text" id="filter-cari" class="glass-input" placeholder="Masukkan nama atau nomor RM...">
                </div>
                <div class="input-group">
                    <label for="filter-dokter">Filter Dokter DPJP (Default)</label>
                    <select id="filter-dokter" class="glass-input">
                        <!-- Option Default -->
                        <option value="drg. Isnoe Suryandanu, Sp.BM" selected>drg. Isnoe Suryandanu, Sp.BM</option>
                        <option value="">-- Tampilkan Semua Dokter --</option>
                        <option value="drg. Kardiani Latief, M.Kes">drg. Kardiani Latief, M.Kes</option>
                        <option value="drg. Putri Sinapoy">drg. Putri Sinapoy</option>
                        <option value="dr. Suryani, Sp.M., M.Kes">dr. Suryani, Sp.M., M.Kes</option>
                    </select>
                </div>
                <!-- Tombol Sync -->
                <div class="input-group">
                    <button class="btn-sync" onclick="fetchData()">Sinkronisasi Data</button>
                </div>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="glass-panel table-container">
            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 1rem; font-weight: 500;">Manifest Tabel Rekam Medis (Semua Tanggal Masuk)</h3>
                <span style="font-size: 0.8rem; background: rgba(167, 139, 250, 0.2); padding: 4px 12px; border-radius: 20px; color: #a78bfa;" id="data-count">Total: 0 Pasien</span>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Ruang & Kamar</th>
                        <th>Data Pasien</th>
                        <th>Dokter Penanggung Jawab</th>
                        <th>Status Registrasi</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
        
        <div class="api-status">
            🟢 GET API System Linked to: <span>https://ishiprsud.vercel.app/api/jadwal</span>
        </div>
    </div>

    <script>
        function updateClock() {
            const options = { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const timeString = new Intl.DateTimeFormat('id-ID', options).format(new Date());
            document.getElementById('live-clock').innerText = timeString.replace(/\./g, ':') + ' WITA';
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchData() {
            const tbody = document.getElementById('table-body');
            const dataCount = document.getElementById('data-count');
            
            const cari = document.getElementById('filter-cari').value;
            const dokter = document.getElementById('filter-dokter').value;
            
            // PERBAIKAN: Tidak ada lagi penambahan filter tanggal secara otomatis di background
            // Sehingga Web Vercel akan menarik SEMUA data dari cache (Sama persis seperti Chrome Ext)

            tbody.innerHTML = `<tr><td colspan="4"><div class="loading-state"><div class="spinner"></div><p>Menarik data dari Vercel Cache...</p></div></td></tr>`;

            try {
                // HANYA menyertakan filter nama & dokter ke URL
                let url = `/api/jadwal?`;
                if(cari) url += `cari=${encodeURIComponent(cari)}&`;
                if(dokter) url += `dokter=${encodeURIComponent(dokter)}&`;

                const response = await fetch(url);
                const textData = await response.text(); 
                
                let result;
                try {
                    result = JSON.parse(textData);
                } catch (parseErr) {
                    throw new Error("Gagal membaca JSON dari server Vercel.");
                }

                if (!result.status || result.data.length === 0) {
                    dataCount.innerText = "Total: 0 Pasien";
                    let msg = result.message || "Tidak ada data jadwal untuk kriteria pencarian ini.";
                    tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><p style="line-height: 1.6; font-size: 0.9rem;">${msg}</p></div></td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                dataCount.innerText = `Total: ${result.total_data} Pasien`;

                result.data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <div class="text-bold">${item.ruangan}</div>
                            <div class="text-dim">${item.no_kamar}</div>
                            <span class="badge badge-room">Rawat Inap</span>
                        </td>
                        <td>
                            <div class="text-bold">${item.nama_pasien}</div>
                            <div class="text-dim">No. RM: ${item.no_rm}</div>
                            <div class="text-dim">TTL: ${item.tanggal_lahir} (Usia: ${item.usia})</div>
                        </td>
                        <td>
                            <div class="text-bold">DPJP Utama:</div>
                            <div class="text-dim" style="color: #e2e8f0; margin-bottom: 8px;">${item.dpjp_utama}</div>
                            <div class="text-bold" style="font-size: 0.75rem;">Rawat Bersama:</div>
                            <div class="text-dim">${item.dokter_rawat_bersama}</div>
                        </td>
                        <td>
                            <div class="text-bold">${item.tanggal_masuk}</div>
                            <div class="text-dim" style="margin-bottom: 8px;">Lama Rawat: ${item.lama_rawat}</div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state" style="color: #ef4444;"><p>Terjadi kesalahan koneksi ke Serverless API.</p><p style="font-size: 0.8rem; margin-top: 5px;">${error.message}</p></div></td></tr>`;
            }
        }

        // Jalankan Fetch otomatis saat web dibuka
        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
            
            // Set Auto-Refresh Data di Web setiap 3 detik 
            // (Agar Web Vercel ikut ter-update tiap kali Extension mengirim data POST baru ke API)
            setInterval(fetchData, 3000);
        });

        document.getElementById('filter-cari').addEventListener('keypress', function(e) { if(e.key === 'Enter') fetchData(); });
    </script>
</body>
</html>
