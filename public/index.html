<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Rawat Inap - Rawat Jalan</title>
    
    <link rel="icon" type="image/png" href="acalogo.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header class="glass-panel header">
            <div class="header-brand">
                <img src="acalogo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
                <div class="header-title">
                    <h1>Monitoring Rawat Inap - Rawat Jalan</h1>
                    <p>High-Availability Data System (Vercel + Google Sheets Fallback)</p>
                </div>
            </div>
            <div class="badges-container">
                <div class="badge-item badge-clock" id="live-clock">Memuat Waktu...</div>
                <div class="badge-item" style="background: rgba(168, 85, 247, 0.2); border-color: #a855f7; color: white;">
                    🔄 Refresh Web: <span id="web-refresh-countdown" style="font-family: monospace; font-weight: bold;">20s</span>
                </div>
            </div>
        </header>

        <!-- PANEL FILTER -->
        <div class="glass-panel">
            <!-- UPGRADE: Lokasi Baru Jam Update & Countdown Scrape -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 style="font-size: 1.1rem; font-weight: 500; margin: 0;">Kontrol Filter & Sinkronisasi</h3>
                <div class="badges-container" style="margin-bottom: 0;">
                    <div class="badge-item" id="last-update">Update Terakhir: --:--:--</div>
                    <div class="badge-item badge-primary">
                        ⏳ Auto-Scrape: <span id="scrape-countdown" style="font-family: monospace; font-weight: bold;">--:--</span>
                    </div>
                </div>
            </div>

            <div class="filter-grid" style="grid-template-columns: 1fr 1fr auto;">
                <div class="input-group">
                    <label for="layanan-selector">Pilih Layanan Poliklinik</label>
                    <select id="layanan-selector" class="glass-input" onchange="gantiLayanan()">
                        <option value="Ranap" selected>Rawat Inap</option>
                        <option value="RajalEndo_AntrianPx">Rawat Jalan - Antrian Px Endodonsi</option>
                        <option value="RajalEndo_RiwayatAntrianPx">Rawat Jalan - Riwayat Antrian Endodonsi</option>
                        <option value="RajalBM_AntrianPx">Rawat Jalan - Antrian Px Bedah Mulut</option>
                        <option value="RajalBM_RiwayatAntrianPx">Rawat Jalan - Riwayat Antrian Bedah Mulut</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="filter-dokter">Filter Dokter DPJP</label>
                    <select id="filter-dokter" class="glass-input" onchange="fetchData()">
                        <option value="drg. Isnoe Suryandanu, Sp.BM" selected>drg. Isnoe Suryandanu, Sp.BM</option>
                        <option value="drg. Irmasmita Tasniadara, Sp.KG">drg. Irmasmita Tasniadara, Sp.KG</option>
                        <option value="">-- Tampilkan Semua Dokter --</option>
                        <option value="drg. Kardiani Latief, M.Kes">drg. Kardiani Latief, M.Kes</option>
                        <option value="drg. Putri Sinapoy">drg. Putri Sinapoy</option>
                        <option value="dr. Suryani, Sp.M., M.Kes">dr. Suryani, Sp.M., M.Kes</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="filter-cari">Pencarian Pasien / No. RM</label>
                    <input type="text" id="filter-cari" class="glass-input" placeholder="Masukkan nama atau nomor RM...">
                </div>
                <div class="input-group" style="grid-column: span 3; justify-self: end;">
                    <button class="btn-sync" onclick="fetchData()">Sinkronisasi Data</button>
                </div>
            </div>
        </div>

        <!-- TABEL DATA -->
        <div class="glass-panel table-container">
            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-size: 1rem; font-weight: 500;">Manifest Tabel Medis</h3>
                <span class="badge" style="background: rgba(167, 139, 250, 0.2); padding: 4px 12px; color: #a78bfa;" id="data-count">Total: 0 Pasien</span>
            </div>
            
            <table>
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
        
        <div class="api-status" id="api-status-bar">
            🟢 Server Status: Menunggu...
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzhDou1e-e4QXDILWfM_mkyagViYOvcpLLv7xL-kJ6cVhpR_R5_bVICdnUYxp0AA90/exec"; 
        let currentDataHash = "";
        let webTimer = 20; 
        
        let targetScrapeTime = 0;
        let isScrapingNow = false;

        function updateClock() {
            const options = { timeZone: 'Asia/Makassar', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const timeString = new Intl.DateTimeFormat('id-ID', options).format(new Date());
            document.getElementById('live-clock').innerText = timeString.replace(/\./g, ':') + ' WITA';
        }
        setInterval(updateClock, 1000); updateClock();

        // 1. PENGHITUNG MUNDUR REFRESH WEB (20 Detik)
        setInterval(() => {
            webTimer--;
            if (webTimer < 0) webTimer = 20;
            const webEl = document.getElementById('web-refresh-countdown');
            if (webEl) webEl.innerText = webTimer.toString().padStart(2, '0') + 's';
        }, 1000);

        // 2. PENGHITUNG MUNDUR AUTO SCRAPE (Dari Vercel API Bridge) ANTI-STUCK
        setInterval(() => {
            const webEl = document.getElementById('scrape-countdown');
            if (!webEl) return;

            if (isScrapingNow) {
                webEl.innerText = "Scraping...";
                webEl.style.color = "#fbbf24";
            } else if (targetScrapeTime) {
                let diff = targetScrapeTime - Date.now();
                if (diff <= 0) {
                    webEl.innerText = "Menyiapkan...";
                    webEl.style.color = "#94a3b8";
                } else {
                    let m = Math.floor(diff / 60000).toString().padStart(2, '0');
                    let s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                    webEl.innerText = `${m}:${s}`;
                    webEl.style.color = "white";
                }
            }
        }, 1000);

        async function fetchScrapeTime() {
            try {
                const res = await fetch('/api/trigger');
                const data = await res.json();
                
                if (data.nextScrapeTime) targetScrapeTime = data.nextScrapeTime;
                if (data.isScraping !== undefined) isScrapingNow = data.isScraping;
                if (data.lastUpdateStr) {
                    let el = document.getElementById('last-update');
                    if (el) el.innerText = "Update Terakhir: " + data.lastUpdateStr;
                }
            } catch (e) {}
        }

        function gantiLayanan() {
            const layanan = document.getElementById('layanan-selector').value;
            const filterDokter = document.getElementById('filter-dokter');
            
            if (layanan === 'Ranap') {
                filterDokter.value = "drg. Isnoe Suryandanu, Sp.BM";
                filterDokter.disabled = false;
                filterDokter.style.opacity = "1";
            } else if (layanan.includes('Endo')) {
                filterDokter.value = "drg. Irmasmita Tasniadara, Sp.KG";
                filterDokter.disabled = true;
                filterDokter.style.opacity = "0.6";
            } else if (layanan.includes('BM')) {
                filterDokter.value = "drg. Isnoe Suryandanu, Sp.BM";
                filterDokter.disabled = true;
                filterDokter.style.opacity = "0.6";
            }
            currentDataHash = ""; 
            fetchData();
        }

        async function fetchData(isBackground = false) {
            webTimer = 20; 
            const webEl = document.getElementById('web-refresh-countdown');
            if (webEl) webEl.innerText = '20s';

            fetchScrapeTime(); // Sinkronkan juga info waktu Scrape
            
            const tbody = document.getElementById('table-body');
            const thead = document.getElementById('table-head');
            const dataCount = document.getElementById('data-count');
            const statusBar = document.getElementById('api-status-bar');
            
            const cari = document.getElementById('filter-cari').value.toLowerCase();
            const dokter = document.getElementById('filter-dokter').value.toLowerCase();
            const endpointName = document.getElementById('layanan-selector').value; 
            
            if (endpointName === 'Ranap') {
                thead.innerHTML = `<tr><th>Ruang & Kamar</th><th>Data Pasien</th><th>Dokter Penanggung Jawab</th><th>Status Registrasi</th></tr>`;
            } else {
                thead.innerHTML = `<tr><th>No. RM</th><th>Data Pasien & Kunjungan</th><th>Penjamin & Dokter</th><th>Status</th></tr>`;
            }

            if (!isBackground) {
                tbody.innerHTML = `<tr><td colspan="4"><div class="loading-state"><div class="spinner"></div><p>Sinkronisasi Server...</p></div></td></tr>`;
            }

            let finalData = [];

            try {
                let vercelUrl = `/api/${endpointName}?`;
                if(cari) vercelUrl += `cari=${encodeURIComponent(cari)}&`;
                if(dokter) vercelUrl += `dokter=${encodeURIComponent(dokter)}&`;

                const response = await fetch(vercelUrl);
                const result = await response.json();

                if (!result.status || result.data.length === 0) throw new Error("Vercel Kosong/Down");
                
                finalData = result.data;
                statusBar.innerHTML = `🟢 Server Utama: <span class="status-main">Vercel API Connected</span>`;

            } catch (error) {
                statusBar.innerHTML = `🟡 Fallback Mode: <span class="status-fallback">Google Sheets API Connected</span>`;
                try {
                    let gasUrl = `${GAS_URL}?type=${endpointName}`;
                    const gasRes = await fetch(gasUrl);
                    const gasResult = await gasRes.json();
                    
                    if (gasResult.status) {
                        let rawData = gasResult.data || [];
                        
                        finalData = rawData.filter(item => {
                            let matchCari = true; let matchDokter = true;
                            if (cari) {
                                matchCari = (item.nama_pasien || '').toLowerCase().includes(cari) || (item.no_rm || '').toLowerCase().includes(cari);
                            }
                            if (dokter) {
                                if (endpointName === 'Ranap') {
                                    matchDokter = (item.dpjp_utama || '').toLowerCase().includes(dokter) || (item.dokter_rawat_bersama || '').toLowerCase().includes(dokter);
                                } else {
                                    matchDokter = (item.dokter || '').toLowerCase().includes(dokter);
                                }
                            }
                            return matchCari && matchDokter;
                        });
                    }
                } catch (e) {
                    if (!isBackground) {
                        tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state" style="color: #ef4444;"><p>Kedua Server (Vercel & Google Sheets) gagal dihubungi.</p></div></td></tr>`;
                    }
                    return;
                }
            }

            let newHash = JSON.stringify(finalData);
            if (isBackground && currentDataHash === newHash) return;
            currentDataHash = newHash;

            if (finalData.length === 0) {
                dataCount.innerText = "Total: 0 Pasien";
                tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><p style="line-height: 1.6; font-size: 0.9rem;">Tidak ada data jadwal untuk layanan & kriteria ini.</p></div></td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            dataCount.innerText = `Total: ${finalData.length} Pasien`;

            finalData.forEach(item => {
                const tr = document.createElement('tr');
                if (endpointName === 'Ranap') {
                    tr.innerHTML = `
                        <td><div class="text-bold">${item.ruangan}</div><div class="text-dim">${item.no_kamar}</div></td>
                        <td><div class="text-bold">${item.nama_pasien}</div><div class="text-dim">RM: ${item.no_rm} | ${item.usia}</div></td>
                        <td><div class="text-bold">${item.dpjp_utama}</div><div class="text-dim">Bersama: ${item.dokter_rawat_bersama}</div></td>
                        <td><div class="text-bold">${item.tanggal_masuk}</div><div class="text-dim">Lama: ${item.lama_rawat}</div></td>
                    `;
                } else {
                    const labelJenis = endpointName.includes('Riwayat') ? '<span class="badge" style="background:#059669;color:white;padding:2px 8px;border-radius:10px;font-size:0.6rem;margin-left:5px;">Riwayat</span>' : '<span class="badge" style="background:#2563eb;color:white;padding:2px 8px;border-radius:10px;font-size:0.6rem;margin-left:5px;">Antrian Px</span>';
                    
                    let statusFinal = item.status || "-";
                    if (item.total && item.total !== "-" && item.total !== "") {
                        statusFinal += `<br><span style="font-size:0.75rem; color:#a78bfa; font-weight:normal; margin-top:4px; display:block;">${item.total}</span>`;
                    }
                    
                    tr.innerHTML = `
                        <td><div class="text-bold" style="font-size: 1.1em;">${item.no_rm}</div></td>
                        <td><div class="text-bold">${item.nama_pasien} ${labelJenis}</div><div class="text-dim">📅 Kunjungan: ${item.tanggal_kunjungan}</div></td>
                        <td><div class="text-bold" style="color: #e2e8f0;">${item.dokter}</div><div class="text-dim">${item.penjamin}</div></td>
                        <td><div class="text-bold">${statusFinal}</div></td>
                    `;
                }
                tbody.appendChild(tr);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('layanan-selector').dispatchEvent(new Event('change'));
            setInterval(() => fetchData(true), 20000);
            fetchScrapeTime();
        });

        document.getElementById('filter-cari').addEventListener('keypress', function(e) { 
            if(e.key === 'Enter') { currentDataHash = ""; fetchData(false); }
        });
    </script>
</body>
</html>
